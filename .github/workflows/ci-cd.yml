# CI: a cada push e pull request confere tipos e build do front e do backend.
# CD: o Render faz o deploy da main sozinho, com Auto-Deploy = "After CI Checks Pass"
#     (espera estes jobs passarem). Sem deploy hook nem secret.
# O front sobe pela integração Git da Vercel (vercel.json), fora deste workflow.
name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Checagem de tipos
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Build
        run: npm run build
      # Erros barram o deploy. `any` e dependencias de hooks ficam como aviso.
      - name: Lint
        run: npm run lint

  backend:
    name: Backend · schema, tipos e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-evolutech
    # O Prisma exige as variáveis do schema mesmo sem conectar. Nenhum job
    # do CI fala com o Neon.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend-evolutech/package-lock.json
      - run: npm ci
      - name: Valida o schema
        run: npx prisma validate
      - run: npx prisma generate
      - name: Build
        run: npm run build
