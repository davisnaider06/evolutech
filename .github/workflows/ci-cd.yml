# CI: a cada push e pull request confere tipos e build do front e do backend.
# CD: na main, só depois de todo o CI passar, dispara o deploy do backend no
#     Render pelo deploy hook (secret RENDER_DEPLOY_HOOK_URL). O Auto-Deploy do
#     Render fica OFF, senão cada merge sobe duas vezes.
# O front sobe pela integração Git da Vercel (vercel.json), fora deste workflow.
name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Checagem de tipos
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Build
        run: npm run build
      # Erros barram o deploy. `any` e dependencias de hooks ficam como aviso.
      - name: Lint
        run: npm run lint

  backend:
    name: Backend · schema, tipos e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-evolutech
    # O Prisma exige as variáveis do schema mesmo sem conectar. Nenhum job
    # do CI fala com o Neon.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend-evolutech/package-lock.json
      - run: npm ci
      - name: Valida o schema
        run: npx prisma validate
      - run: npx prisma generate
      - name: Build
        run: npm run build

  deploy:
    name: Deploy do backend (main)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: producao
    steps:
      - name: Dispara o deploy no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # Sem o secret o job FALHA: antes ele so avisava e aparecia como
          # "success" sem ter feito deploy nenhum.
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL nao configurado; deploy nao disparado."
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 5 -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy do backend disparado no Render para ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
